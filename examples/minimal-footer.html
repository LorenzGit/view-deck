<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    footer { height: 100%; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-top: 1px solid #2b2d30; color: #d7d9dc; background: #101113; font-size: 13px; }
    button { height: 30px; padding: 0 12px; border: 0; border-radius: 7px; color: #172005; background: #b8ee55; font: inherit; font-weight: 650; }
  </style>
</head>
<body>
  <footer><span>Optional footer content</span><button type="button">Action</button></footer>
</body>
</html>
