<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>h5_header</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050505; color: #d8d9db; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; }
    header { height: 100%; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid #232426; background: #050505; }
    svg { display: block; flex: 0 0 auto; }
    .title { min-width: 0; flex: 1; overflow: hidden; font-size: 16px; font-weight: 450; text-overflow: ellipsis; white-space: nowrap; }
    .actions { display: flex; align-items: center; gap: 17px; color: #888b8f; }
    .favorite { color: #f5f5f5; }
    @media (max-width: 360px) { header { gap: 10px; padding: 0 11px; } .actions { gap: 12px; } .title { font-size: 14px; } }
  </style>
</head>
<body>
  <header>
    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#f3f3f3" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18"/></svg>

    <span class="title">Preview App</span>
    <span class="actions">
      <svg class="favorite" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 21-1.45-1.32C5.4 15 2 11.92 2 8.15 2 5.08 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09A6.02 6.02 0 0 1 16.5 3C19.58 3 22 5.08 22 8.15c0 3.77-3.4 6.85-8.55 11.54L12 21Z"/></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M5 5h14v11H9l-4 4V5Z"/></svg>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
    </span>
  </header>
</body>
</html>
